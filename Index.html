<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Donalds Fast Food — Peça online agora!">
  <meta name="theme-color" content="#e63946">

  <title>Donalds Fast Food</title>

  <!-- PWA -->
  <link rel="manifest" href="pwa/manifest.json">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Banner offline com suporte a leitores de tela -->
  <div id="offline-banner" class="offline-banner" role="status" aria-live="polite">
    📡 Sem conexão — os pedidos serão sincronizados quando você voltar online.
  </div>

  <!-- Navbar -->
  <nav class="navbar-donalds">
    <a href="index.html" class="brand-logo">Donalds</a>

    <div class="nav-actions">
      <a href="orders.html" class="btn-cart" style="background:transparent;border:1px solid #333;color:var(--text-muted);font-size:.82rem;">
        Meus Pedidos
      </a>

      <a href="cart.html" class="btn-cart" id="btn-cart-nav" aria-label="Ver Carrinho">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zm3.102 3 1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5 13a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        Carrinho
        <span id="cart-badge" class="cart-badge" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <!-- Hero -->
  <div class="page-hero">
    <h1>🍔 Cardápio</h1>
    <p>Escolha o que você quer e peça agora</p>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Grid de produtos com skeletons nativos enquanto carrega -->
  <div id="products" class="loading-grid">
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w-80"></div><div class="skeleton-line w-40"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w-80"></div><div class="skeleton-line w-40"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line w-80"></div><div class="skeleton-line w-40"></div></div></div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/offline.js"></script>

  <!-- PWA Service Worker -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("pwa/service-worker.js", { scope: "/" })
      .then(() => console.log("[SW] Registrado com escopo raiz"))
      .catch((e) => console.warn("[SW] Falha ao registrar:", e));
  }
</script>


</body>
</html>
