<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e63946">

  <title>Carrinho — Donalds</title>

  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Banner offline -->
  <div id="offline-banner" class="offline-banner" role="status" aria-live="polite">
    📡 Sem conexão — o pedido será salvo para sincronizar.
  </div>

  <!-- Navbar -->
  <nav class="navbar-donalds">
    <a href="/" class="brand-logo">Donalds</a>
    <div class="nav-actions">
      <a href="/orders.html" class="btn-cart" style="background:transparent;border:1px solid #333;color:var(--text-muted);font-size:.82rem;">
        Meus Pedidos
      </a>
    </div>
  </nav>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Página do carrinho -->
  <main class="cart-page">

    <div class="cart-header">
      <a href="/" class="btn-back" title="Voltar ao cardápio" aria-label="Voltar ao cardápio">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
        </svg>
      </a>
      <h2>Meu Carrinho</h2>
    </div>

    <!-- Lista de itens (renderizada por cart.js) -->
    <div id="cartList"></div>

    <!-- Resumo do pedido -->
    <div id="cartSummary" class="cart-summary" style="display:none"></div>

    <!-- Botão finalizar -->
    <button
      id="btnCheckout"
      class="btn-checkout"
      onclick="checkout()"
      disabled
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"/>
      </svg>
      Finalizar Pedido
    </button>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/offline.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("/pwa/service-worker.js", { scope: "/" })
        .catch(() => {});
    }
  </script>

</body>
</html>
