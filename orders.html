<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Meus Pedidos — Donalds</title>

  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Banner offline -->
  <div id="offline-banner" class="offline-banner" role="status" aria-live="polite">
    📡 Sem conexão — exibindo histórico local.
  </div>

  <nav class="navbar-donalds">
    <a href="/" class="brand-logo">Donalds</a>
    <div class="nav-actions">
      <a href="/cart.html" class="btn-cart" id="btn-cart-nav" aria-label="Ver Carrinho">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zm3.102 3 1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5 13a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        Carrinho
        <span id="cart-badge" class="cart-badge" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <div id="toast-container"></div>

  <main style="max-width:680px;margin:0 auto;padding:1.5rem 1.25rem;">

    <div class="cart-header">
      <a href="/" class="btn-back" title="Voltar" aria-label="Voltar para a página inicial">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
        </svg>
      </a>
      <h2>Meus Pedidos</h2>
    </div>

    <div id="ordersList"></div>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/offline.js"></script>
  <script src="/js/orders.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("/pwa/service-worker.js", { scope: "/" })
        .catch(() => {});
    }
  </script>

</body>
</html>
